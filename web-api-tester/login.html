<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Web API 测试工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            animation: fadeIn 0.5s ease-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            border-radius: 15px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(37, 99, 235, 0.3);
        }
        
        .logo svg {
            width: 35px;
            height: 35px;
            fill: white;
        }
        
        h1 {
            color: #1a202c;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #718096;
            font-size: 16px;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #4a5568;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        
        .input-group {
            position: relative;
        }
        
        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
        }
        
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            background-color: #f7fafc;
        }
        
        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #2563eb;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        
        input[type="text"]:invalid,
        input[type="password"]:invalid {
            border-color: #fc8181;
        }
        
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #a0aec0;
            transition: color 0.3s;
        }
        
        .password-toggle:hover {
            color: #4a5568;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            cursor: pointer;
        }
        
        .remember-me label {
            margin-bottom: 0;
            cursor: pointer;
            user-select: none;
        }
        
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }
        
        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .login-btn:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        .demo-accounts {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #e2e8f0;
            text-align: center;
        }
        
        .demo-title {
            color: #718096;
            font-size: 14px;
            margin-bottom: 15px;
        }
        
        .demo-account {
            display: inline-block;
            margin: 5px;
            padding: 8px 16px;
            background-color: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 13px;
            color: #4a5568;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .demo-account:hover {
            background-color: #edf2f7;
            border-color: #cbd5e0;
            transform: translateY(-1px);
        }
        
        .error-message {
            background-color: #fed7d7;
            color: #c53030;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            animation: shake 0.5s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .success-message {
            background-color: #c6f6d5;
            color: #276749;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .footer-links {
            text-align: center;
            margin-top: 25px;
            color: #718096;
            font-size: 14px;
        }
        
        .footer-links a {
            color: #2563eb;
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .footer-links a:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <div class="logo">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z"/>
                </svg>
            </div>
            <h1>Web API 测试工具</h1>
            <p class="subtitle">请登录以继续</p>
        </div>
        
        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>
        
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">用户名</label>
                <div class="input-group">
                    <span class="input-icon">👤</span>
                    <input type="text" id="username" name="username" required placeholder="请输入用户名" autocomplete="username">
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">密码</label>
                <div class="input-group">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" name="password" required placeholder="请输入密码" autocomplete="current-password">
                    <span class="password-toggle" onclick="togglePassword()">👁️</span>
                </div>
            </div>
            
            <div class="remember-me">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">记住我</label>
            </div>
            
            <button type="submit" class="login-btn" id="login-btn">
                登录
            </button>
        </form>
        
        <div class="demo-accounts">
            <p class="demo-title">演示账号（点击快速填充）</p>
            <span class="demo-account" onclick="fillDemo('admin', 'admin123')">
                管理员: admin / admin123
            </span>
            <span class="demo-account" onclick="fillDemo('user', 'user123')">
                普通用户: user / user123
            </span>
        </div>
        
        <div class="footer-links">
            <a href="#" onclick="showMessage('info', '请联系管理员重置密码')">忘记密码？</a>
            <span> · </span>
            <a href="#" onclick="showMessage('info', '请联系管理员创建账号')">注册账号</a>
        </div>
    </div>
    
    <script>
        // 检查是否已登录
        function checkAuth() {
            const token = localStorage.getItem('apiTestToken');
            const tokenExpiry = localStorage.getItem('apiTestTokenExpiry');
            
            if (token && tokenExpiry) {
                const now = new Date().getTime();
                if (now < parseInt(tokenExpiry)) {
                    // 已登录，跳转到主页
                    window.location.href = '/index.html';
                } else {
                    // Token已过期，清除
                    localStorage.removeItem('apiTestToken');
                    localStorage.removeItem('apiTestTokenExpiry');
                    localStorage.removeItem('apiTestUser');
                }
            }
        }
        
        // 页面加载时检查认证状态
        checkAuth();
        
        // 切换密码显示
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggle = document.querySelector('.password-toggle');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggle.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggle.textContent = '👁️';
            }
        }
        
        // 填充演示账号
        function fillDemo(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
            document.getElementById('remember').checked = true;
            
            // 添加填充动画效果
            const inputs = document.querySelectorAll('input[type="text"], input[type="password"]');
            inputs.forEach(input => {
                input.style.animation = 'none';
                setTimeout(() => {
                    input.style.animation = 'fadeIn 0.3s ease-out';
                }, 10);
            });
        }
        
        // 显示消息
        function showMessage(type, message) {
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');
            
            if (type === 'error') {
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
                successDiv.style.display = 'none';
                
                setTimeout(() => {
                    errorDiv.style.display = 'none';
                }, 5000);
            } else if (type === 'success') {
                successDiv.textContent = message;
                successDiv.style.display = 'block';
                errorDiv.style.display = 'none';
                
                setTimeout(() => {
                    successDiv.style.display = 'none';
                }, 3000);
            } else if (type === 'info') {
                alert(message);
            }
        }
        
        // 处理登录
        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            const loginBtn = document.getElementById('login-btn');
            
            // 显示加载状态
            loginBtn.disabled = true;
            loginBtn.innerHTML = '登录中<span class="loading"></span>';
            
            try {
                // 发送登录请求到服务器
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password, remember })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    // 登录成功
                    showMessage('success', '登录成功，正在跳转...');
                    
                    // 保存认证信息
                    localStorage.setItem('apiTestToken', data.token);
                    localStorage.setItem('apiTestUser', JSON.stringify(data.user));
                    
                    // 如果选择记住我，延长token有效期
                    const expiry = remember ? 
                        new Date().getTime() + (7 * 24 * 60 * 60 * 1000) : // 7天
                        new Date().getTime() + (24 * 60 * 60 * 1000); // 1天
                    localStorage.setItem('apiTestTokenExpiry', expiry);
                    
                    // 跳转到主页
                    setTimeout(() => {
                        const redirect = new URLSearchParams(window.location.search).get('redirect');
                        window.location.href = redirect || '/index.html';
                    }, 1000);
                } else {
                    // 登录失败
                    showMessage('error', data.message || '用户名或密码错误');
                }
            } catch (error) {
                // 网络错误或其他错误
                console.error('Login error:', error);
                
                // 为了演示，使用本地验证
                if ((username === 'admin' && password === 'admin123') || 
                    (username === 'user' && password === 'user123')) {
                    // 模拟登录成功
                    showMessage('success', '登录成功，正在跳转...');
                    
                    // 生成模拟token
                    const token = btoa(JSON.stringify({ username, timestamp: Date.now() }));
                    localStorage.setItem('apiTestToken', token);
                    localStorage.setItem('apiTestUser', JSON.stringify({ 
                        username, 
                        role: username === 'admin' ? 'admin' : 'user',
                        name: username === 'admin' ? '管理员' : '普通用户'
                    }));
                    
                    // 设置token过期时间
                    const expiry = remember ? 
                        new Date().getTime() + (7 * 24 * 60 * 60 * 1000) : 
                        new Date().getTime() + (24 * 60 * 60 * 1000);
                    localStorage.setItem('apiTestTokenExpiry', expiry);
                    
                    // 跳转
                    setTimeout(() => {
                        const redirect = new URLSearchParams(window.location.search).get('redirect');
                        window.location.href = redirect || '/index.html';
                    }, 1000);
                } else {
                    showMessage('error', '用户名或密码错误');
                }
            } finally {
                // 恢复按钮状态
                loginBtn.disabled = false;
                loginBtn.textContent = '登录';
            }
        }
        
        // 监听Enter键
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter' && event.target.tagName !== 'BUTTON') {
                document.getElementById('login-form').requestSubmit();
            }
        });
    </script>
</body>
</html>
